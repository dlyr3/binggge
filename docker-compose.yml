services:
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASS}@db:5432/binggge
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binggge
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped
volumes:
  pgdata:
